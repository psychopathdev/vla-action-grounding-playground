[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicebench-load"
version = "0.1.0"
description = "Provider-neutral load testing toolkit for speech and voice model APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "voicebench-load contributors" }]
keywords = ["speech", "voice", "load-testing", "benchmark", "latency"]
dependencies = ["PyYAML>=6.0", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
voicebench-load = "voicebench_load.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voicebench_load"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
packages = ["voicebench_load"]
ignore_missing_imports = true
